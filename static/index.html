<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanctuary & Chronicles</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --surface-color: #1a1a1e;
            --text-color: #e1e1e6;
            --hint-color: #82828c;
            --accent-color: #d4af37;
            --border-color: #2a2a30;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            padding-bottom: 70px;
        }
        h2 {
            font-weight: 400;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            color: var(--accent-color);
            margin-top: 0;
        }
        .tab { display: none; }
        .tab.active { display: block; }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 6px 0 14px 0;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }
        input:focus, textarea:focus {
            border-color: var(--accent-color);
            outline: none;
        }
        button {
            background-color: var(--accent-color);
            color: #121214;
            border: none;
            padding: 12px;
            border-radius: 6px;
            width: 100%;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }
        .nav {
            display: flex;
            justify-content: space-around;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface-color);
            padding: 10px;
            border-top: 1px solid var(--border-color);
        }
        .nav button {
            background: none;
            color: var(--hint-color);
            font-size: 13px;
            width: auto;
            font-weight: normal;
        }
        .nav button.active-nav {
            color: var(--accent-color);
        }
        .card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .archived {
            text-decoration: line-through;
            opacity: 0.4;
        }
        .card img {
            max-width: 100%;
            border-radius: 4px;
            margin-top: 8px;
        }
        .file-label {
            display: block;
            background: #222228;
            border: 1px dashed var(--border-color);
            padding: 10px;
            text-align: center;
            border-radius: 6px;
            margin-bottom: 14px;
            cursor: pointer;
            color: var(--hint-color);
            font-size: 14px;
        }
        .file-label input { display: none; }
    </style>
</head>
<body>

    <!-- Вкладка 1: Хроники -->
    <div id="chronicles-tab" class="tab active">
        <h2 id="l-chronicles-title">🏛️ Хроники дня</h2>
        <input type="text" id="chron-text" placeholder="...">
        <input type="text" id="chron-time" placeholder="09:00 - 10:00">
        <input type="date" id="chron-date">
        <button onclick="addChronicle()" id="l-chron-btn">Записать в хроники</button>
        <div id="chronicles-list" style="margin-top: 20px;"></div>
    </div>

    <!-- Вкладка 2: Убежище -->
    <div id="sanctuary-tab" class="tab">
        <h2 id="l-sanctuary-title">🕯️ Убежище мыслей</h2>
        <textarea id="sanc-text" rows="3" placeholder="..."></textarea>
        
        <label class="file-label">
            <span id="l-file-label">📎 Прикрепить свиток/изображение</span>
            <input type="file" id="sanc-file" accept="image/*">
        </label>
        
        <button onclick="addSanctuary()" id="l-sanc-btn">Сохранить в тишине</button>
        <div id="sanctuary-list" style="margin-top: 20px;"></div>
    </div>

    <!-- Навигация -->
    <div class="nav">
        <button onclick="switchTab('chronicles')" id="nav-chron" class="active-nav">🏛️ Хроники</button>
        <button onclick="switchTab('sanctuary')" id="nav-sanc">🕯️ Убежище</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe?.user?.id || 999999;
        
        // Адрес вашего бэкенда на Bothost прописан автоматически
        const API_URL = "https://bot-1790210796-8710-prokudin95.bothost.tech";

        const userLang = tg.initDataUnsafe?.user?.language_code || 'ru';
        const isRu = userLang.startsWith('ru');

        const i18n = {
            ru: {
                chronTitle: "🏛️ Хроники дня",
                chronPlaceholder: "Суть задачи или расписания...",
                chronTimePlaceholder: "Время (например, 10:00 - 11:30)",
                chronBtn: "Записать в хроники",
                sancTitle: "🕯️ Убежище мыслей",
                sancPlaceholder: "О чем вы думаете в этот момент...",
                fileLabel: "📎 Прикрепить изображение или записку",
                sancBtn: "Сохранить в тишине",
                navChron: "🏛️ Хроники",
                navSanc: "🕯️ Убежище"
            },
            en: {
                chronTitle: "🏛️ Chronicles",
                chronPlaceholder: "Task or schedule details...",
                chronTimePlaceholder: "Time slot (e.g. 10:00 - 11:30)",
                chronBtn: "Write to Chronicles",
                sancTitle: "🕯️ Sanctuary",
                sancPlaceholder: "Your thoughts in solitude...",
                fileLabel: "📎 Attach image or note photo",
                sancBtn: "Save in Silence",
                navChron: "🏛️ Chronicles",
                navSanc: "🕯️ Sanctuary"
            }
        };

        const t = isRu ? i18n.ru : i18n.en;

        document.getElementById('l-chronicles-title').innerText = t.chronTitle;
        document.getElementById('chron-text').placeholder = t.chronPlaceholder;
        document.getElementById('chron-time').placeholder = t.chronTimePlaceholder;
        document.getElementById('l-chron-btn').innerText = t.chronBtn;
        
        document.getElementById('l-sanctuary-title').innerText = t.sancTitle;
        document.getElementById('sanc-text').placeholder = t.sancPlaceholder;
        document.getElementById('l-file-label').innerText = t.fileLabel;
        document.getElementById('l-sanc-btn').innerText = t.sancBtn;
        
        document.getElementById('nav-chron').innerText = t.navChron;
        document.getElementById('nav-sanc').innerText = t.navSanc;

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav button').forEach(el => el.classList.remove('active-nav'));
            
            document.getElementById(tabName + '-tab').classList.add('active');
            document.getElementById('nav-' + (tabName === 'chronicles' ? 'chron' : 'sanc')).classList.add('active-nav');

            if(tabName === 'chronicles') loadChronicles();
            if(tabName === 'sanctuary') loadSanctuary();
        }

        async function loadChronicles() {
            let res = await fetch(`${API_URL}/api/chronicles/${userId}`);
            let items = await res.json();
            let html = '';
            items.forEach(i => {
                let timeStr = i.time_slot ? `[${i.time_slot}] ` : '';
                let dateStr = i.date ? ` (${i.date})` : '';
                html += `<div class="card" onclick="toggleChronicle(${i.id})">
                    <span class="${i.status === 'archived' ? 'archived' : ''}"><b>${timeStr}</b>${i.text}${dateStr}</span>
                </div>`;
            });
            document.getElementById('chronicles-list').innerHTML = html;
        }

        async function addChronicle() {
            let text = document.getElementById('chron-text').value;
            let time_slot = document.getElementById('chron-time').value;
            let date = document.getElementById('chron-date').value;
            if(!text) return;

            await fetch(`${API_URL}/api/chronicles`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user_id: userId, text, time_slot, date})
            });

            document.getElementById('chron-text').value = '';
            document.getElementById('chron-time').value = '';
            loadChronicles();
        }

        async function toggleChronicle(id) {
            await fetch(`${API_URL}/api/chronicles/toggle`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({task_id: id, user_id: userId})
            });
            loadChronicles();
        }

        async function loadSanctuary() {
            let res = await fetch(`${API_URL}/api/sanctuary/${userId}`);
            let items = await res.json();
            let html = '';
            items.forEach(i => {
                let imgHtml = i.image_path ? `<img src="${API_URL}${i.image_path}">` : '';
                html += `<div class="card">
                    <div style="white-space: pre-wrap;">${i.text}</div>
                    ${imgHtml}
                    <div style="font-size: 11px; color: var(--hint-color); margin-top: 6px;">${i.created_at}</div>
                </div>`;
            });
            document.getElementById('sanctuary-list').innerHTML = html;
        }

        async function addSanctuary() {
            let text = document.getElementById('sanc-text').value;
            let fileInput = document.getElementById('sanc-file');
            
            let formData = new FormData();
            formData.append('user_id', userId);
            formData.append('text', text);
            if(fileInput.files[0]) {
                formData.append('file', fileInput.files[0]);
            }

            await fetch(`${API_URL}/api/sanctuary`, {
                method: 'POST',
                body: formData
            });

            document.getElementById('sanc-text').value = '';
            fileInput.value = '';
            loadSanctuary();
        }

        loadChronicles();
    </script>
</body>
</html>
