<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хроники & Убежище</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #121212);
            --text-color: var(--tg-theme-text-color, #e0e0e0);
            --hint-color: var(--tg-theme-hint-color, #888888);
            --button-color: var(--tg-theme-button-color, #4a90e2);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--hint-color);
            padding-bottom: 6px;
        }

        .section {
            margin-bottom: 24px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background: var(--card-bg);
            border: 1px solid var(--hint-color);
            border-radius: 8px;
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 14px;
        }

        .row {
            display: flex;
            gap: 8px;
        }

        button {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            margin-top: 4px;
        }

        button:active {
            opacity: 0.8;
        }

        .card {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .card.archived {
            text-decoration: line-through;
            opacity: 0.5;
        }

        .card img {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 8px;
        }

        .meta {
            font-size: 12px;
            color: var(--hint-color);
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <!-- Секция: Хроники (Задачи) -->
    <div class="section">
        <h2>📜 Хроники</h2>
        <input type="text" id="chronicleInput" placeholder="Что нужно сделать...">
        <div class="row">
            <input type="text" id="chronicleTime" placeholder="Время (например, 14:00)">
            <input type="date" id="chronicleDate">
        </div>
        <button onclick="addChronicle()">Записать в хроники</button>
        <div id="chroniclesList" style="margin-top: 12px;"></div>
    </div>

    <!-- Секция: Убежище (Заметки и цитаты с картинок) -->
    <div class="section">
        <h2>🛡️ Убежище</h2>
        <textarea id="sanctuaryInput" rows="3" placeholder="Ваши мысли, цитаты..."></textarea>
        <input type="file" id="sanctuaryImage" accept="image/*">
        <button onclick="addSanctuary()">Сохранить в тишине</button>
        <div id="sanctuaryList" style="margin-top: 12px;"></div>
    </div>

    <script>
        const API_URL = "https://bot-1790210796-8710-prokudin95.bothost.tech";
        
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = (tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : 123456789;

        window.onload = function() {
            loadChronicles();
            loadSanctuary();
        };

        // --- ХРОНИКИ ---
        async function loadChronicles() {
            try {
                let res = await fetch(`${API_URL}/api/chronicles/${userId}`);
                let items = await res.json();
                let list = document.getElementById("chroniclesList");
                list.innerHTML = "";
                items.forEach(item => {
                    let div = document.createElement("div");
                    div.className = `card ${item.status === 'archived' ? 'archived' : ''}`;
                    
                    let metaText = "";
                    if (item.time_slot || item.date) {
                        metaText = `<div class="meta">⏰ ${item.time_slot || ''} ${item.date || ''}</div>`;
                    }

                    div.innerHTML = `<span>${item.text}</span>${metaText}`;
                    div.onclick = () => toggleChronicle(item.id);
                    list.appendChild(div);
                });
            } catch (e) {
                console.error("Ошибка загрузки хроник:", e);
            }
        }

        async function addChronicle() {
            let input = document.getElementById("chronicleInput");
            let timeInput = document.getElementById("chronicleTime");
            let dateInput = document.getElementById("chronicleDate");
            
            if (!input.value.trim()) return;

            try {
                await fetch(`${API_URL}/api/chronicles`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        user_id: userId, 
                        text: input.value, 
                        time_slot: timeInput.value || null, 
                        date: dateInput.value || null 
                    })
                });
                input.value = "";
                timeInput.value = "";
                dateInput.value = "";
                loadChronicles();
            } catch (e) {
                console.error("Ошибка сохранения хроники:", e);
                alert("Не удалось сохранить задачу.");
            }
        }

        async function toggleChronicle(taskId) {
            try {
                await fetch(`${API_URL}/api/chronicles/toggle`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ task_id: taskId, user_id: userId })
                });
                loadChronicles();
            } catch (e) {
                console.error("Ошибка изменения статуса:", e);
            }
        }

        // --- УБЕЖИЩЕ ---
        async function loadSanctuary() {
            try {
                let res = await fetch(`${API_URL}/api/sanctuary/${userId}`);
                let items = await res.json();
                let list = document.getElementById("sanctuaryList");
                list.innerHTML = "";
                items.forEach(item => {
                    let div = document.createElement("div");
                    div.className = "card";
                    
                    let imgHtml = item.image_path ? `<img src="${API_URL}${item.image_path}" alt="attachment">` : "";
                    div.innerHTML = `<span>${item.text}</span>${imgHtml}`;
                    
                    list.appendChild(div);
                });
            } catch (e) {
                console.error("Ошибка загрузки убежища:", e);
            }
        }

        async function addSanctuary() {
            let input = document.getElementById("sanctuaryInput");
            let imageInput = document.getElementById("sanctuaryImage");
            
            if (!input.value.trim() && imageInput.files.length === 0) return;

            let formData = new FormData();
            formData.append("user_id", userId);
            formData.append("text", input.value);
            if (imageInput.files[0]) {
                formData.append("file", imageInput.files[0]);
            }

            try {
                await fetch(`${API_URL}/api/sanctuary`, {
                    method: "POST",
                    body: formData
                });
                input.value = "";
                imageInput.value = "";
                loadSanctuary();
            } catch (e) {
                console.error("Ошибка сохранения заметки:", e);
                alert("Не удалось сохранить заметку.");
            }
        }
    </script>
</body>
</html>
